<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Fund Accounting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .error-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .error-message {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            padding: 20px;
            background: #f3f4f6;
            border-left: 4px solid #ef4444;
            border-radius: 4px;
            text-align: left;
            font-family: 'Courier New', monospace;
        }

        .actions {
            margin-top: 30px;
        }

        a {
            display: inline-block;
            padding: 10px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px;
            transition: background 0.3s ease;
        }

        a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>Something went wrong</h1>
        <div class="error-message">{{ error }}</div>
        <div class="actions">
            <a href="/">← Back to Dashboard</a>
            <a href="javascript:location.reload()">🔄 Refresh Page</a>
        </div>
        <p style="color: #999; font-size: 0.9em; margin-top: 30px;">
            If the problem persists, check the application logs.
        </p>
    </div>
</body>
</html>
