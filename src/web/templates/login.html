<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio Dashboard</title>
    <style>
        :root { --primary: #27AE60; --danger: #c0392b; --bg: #f4f6f5; --card: #ffffff; --text: #1f2d24; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) { --bg: #111815; --card: #1c2620; --text: #e6efe9; }
        }
        :root[data-theme="dark"] { --bg: #111815; --card: #1c2620; --text: #e6efe9; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; padding: 16px; }
        .card { background: var(--card); padding: 32px; border-radius: 10px; width: 100%; max-width: 360px;
                box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
        h1 { font-size: 1.3em; margin: 0 0 20px; color: var(--primary); }
        label { display: block; font-size: 0.9em; margin-bottom: 6px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 16px; border-radius: 6px;
                border: 1px solid #ccc; background: transparent; color: var(--text); font-size: 1em; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--primary);
                 color: #fff; font-size: 1em; cursor: pointer; }
        .erro { color: var(--danger); margin-bottom: 16px; font-size: 0.9em; }
        .aviso { color: var(--primary); margin-bottom: 16px; font-size: 0.9em; }
    </style>
</head>
<body>
    <form class="card" method="post">
        <h1>Portfolio Dashboard</h1>
        {% if aviso %}<div class="aviso">{{ aviso }}</div>{% endif %}
        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
        <label for="usuario">User</label>
        <input id="usuario" name="usuario" autocomplete="username" required autofocus>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
